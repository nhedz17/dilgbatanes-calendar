
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Mobile Responsive Viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>DILG Batanes Office Operations System</title>

<!-- Website Favicon -->
<link rel="icon" type="image/png" href="dilglogo.PNG">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
</style>

</head>
<body>

<iframe
src="https://script.google.com/macros/s/AKfycbzDGEnEUpvOESQCu6GL-L0Of3gQz9W7pSnz-WhRvp_331Z_Tfv0HVaeWEALt5wcKckn/exec"

height="100%"
allowfullscreen="true"
style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
</iframe>

<script>
window.onload = function() {
document.querySelector('iframe').requestFullscreen().catch((err) => {
console.error(`Error attempting to enable full-screen mode: ${err.message}`);
});
};
</script>

</body>
</html>
